name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Typecheck / Lint / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # ビルドは DB に接続しない(DB を使う処理はリクエスト時にだけ動く)。値は形式だけ合わせたダミー
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-dummy-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # postinstall で prisma generate が動く
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: recipe_share_test
          POSTGRES_USER: recipe
          POSTGRES_PASSWORD: recipe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipe -d recipe_share_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # データベース名は _test で終わる必要がある(tests/support/test-database.ts)
      TEST_DATABASE_URL: postgresql://recipe:recipe@localhost:5432/recipe_share_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # マイグレーションはテストの前に自動で当てる(tests/support/integration-global-setup.ts)
      - run: npm run test:integration
